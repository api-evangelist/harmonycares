aid: harmonycares
name: Harmonycares
description: >-
  HarmonyCares is a physician-led, value-based, in-home primary care organization headquartered in
  Troy, Michigan, and one of the nation's largest house-call practices. It brings primary care,
  palliative care, and ancillary services such as in-home laboratory, radiology, and comprehensive
  health assessments directly to older adults living with serious and complex chronic conditions.
  Operating across roughly a dozen states, HarmonyCares supports more than 70,000 patients through
  value-based arrangements with Medicare Advantage plans and Medicare ACO programs. The company was
  surfaced through the API Evangelist network as a General Catalyst portfolio company; it publishes a
  public marketing site, a patient portal, and corporate policy documents, but no public developer
  program, API, or SDK was found during enrichment.
